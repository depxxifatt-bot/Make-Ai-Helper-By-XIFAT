    <script>
        // Telegram WebApp Initialize
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Render Backend API Endpoint
        const BACKEND_URL = "https://xif4t-follow-bot.onrender.com/send-follow";

        // Tab Switching Logic
        function switchTab(tabName) {
            const tabs = document.querySelectorAll('.tab-btn');
            const contents = document.querySelectorAll('.tab-content');

            tabs.forEach(tab => tab.classList.remove('active'));
            contents.forEach(content => content.classList.remove('active'));

            if (tabName === 'follows') {
                tabs[0].classList.add('active');
                document.getElementById('follows-tab').classList.add('active');
            } else {
                tabs[1].classList.add('active');
                document.getElementById('developer-tab').classList.add('active');
            }
        }

        async function processFollow() {
            const uidInput = document.getElementById("playerUid").value.trim();
            const regionInput = document.getElementById("regionSelect").value;
            const sendBtn = document.getElementById("sendBtn");
            const statusOutput = document.getElementById("statusOutput");

            if (!uidInput || uidInput.length < 8) {
                statusOutput.className = "status-msg error";
                statusOutput.innerHTML = "❌ Please enter a valid Player UID!";
                return;
            }

            const telegramUserId = tg.initDataUnsafe?.user?.id;

            sendBtn.disabled = true;
            statusOutput.className = "status-msg loading";
            statusOutput.innerHTML = "Please wait ⏳ Processing Follows...";

            try {
                const response = await fetch(BACKEND_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        uid: uidInput,
                        region: regionInput,
                        user_id: telegramUserId
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    statusOutput.className = "status-msg success";
                    statusOutput.innerHTML = `✅ ${data.sent_count} Follows Sent Successfully!`;
                } 
                else if (response.status === 403 && data.must_join) {
                    statusOutput.className = "status-msg error";
                    statusOutput.innerHTML = `⚠️ You must join our channel first!<br>
                    <a href="${data.channel_link}" target="_blank" class="join-btn">👉 Join Channel Now</a>`;
                } 
                else {
                    statusOutput.className = "status-msg error";
                    statusOutput.innerHTML = `❌ Error: ${data.message || 'Failed to send follows!'}`;
                }

            } catch (err) {
                statusOutput.className = "status-msg error";
                statusOutput.innerHTML = "❌ Connection Error! Check your backend server.";
            } finally {
                sendBtn.disabled = false;
            }
        }
    </script>
